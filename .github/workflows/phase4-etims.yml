name: Phase 4 — eTIMS Fiscal Boundaries & PostgreSQL
on:
  push:
    branches: ['phase4/etims-fiscal-integration']
  pull_request:
    paths:
      - 'server/local/**'
      - 'src/**'
      - 'drizzle/migrations/0007_fiscal_etims.sql'
      - 'scripts/local/**'
      - 'tests/phase4/**'
      - '.github/workflows/phase4-etims.yml'
permissions:
  contents: read
jobs:
  local-etims:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fdos_etims_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d fdos_etims_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fdos_etims_ci
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fdos_etims_ci
      FDOS_FRONTEND_ORIGIN: http://localhost:3000
      FDOS_ETIMS_MODE: preview
      FDOS_ETIMS_APPROVED_SANDBOX: 'NO'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate local SQL and shell bootstrapping
        run: |
          bash -n scripts/local/bootstrap.sh scripts/local/migrate-phase3.sh scripts/local/migrate-phase4.sh
          for f in server/local/*.mjs; do node --check "$f"; done
      - name: Apply real PostgreSQL 16 migrations (financial + communications + fiscal)
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/supabase-auth-shim.sql
          for f in drizzle/migrations/000{0,1,2,3,4,5,6,7}_*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$f"
          done
          psql -X -v ON_ERROR_STOP=1 -f server/local/schema.sql
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Check TypeScript
        run: bunx tsc --noEmit
      - name: Run document renderer tests
        run: bunx vitest run src/lib/document-templates.test.ts src/components/document-sheet.test.tsx
      - name: Run Phase 4 fiscal API and mocked sandbox tests
        run: node --test tests/phase4/fiscal.test.mjs
