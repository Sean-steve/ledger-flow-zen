name: financial-document-os-local
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fdos_local
      POSTGRES_USER: fdos_dev
      POSTGRES_PASSWORD: ${FDOS_DB_PASSWORD:?Set FDOS_DB_PASSWORD in .env.local}
    ports:
      - "127.0.0.1:${FDOS_DB_PORT:-55434}:5432"
    volumes:
      - fdos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdos_dev -d fdos_local"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  fdos_pgdata:
